[package]
name = "flaketest"
version = "0.1.0"
edition = "2021"
description = "Run a test command N times, find out which tests are actually flaky"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/flaketest"
readme = "README.md"
keywords = ["testing", "flaky", "ci", "reliability"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "flaketest"
path = "src/lib.rs"

[[bin]]
name = "flaketest"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
regex = "1"

[dev-dependencies]
